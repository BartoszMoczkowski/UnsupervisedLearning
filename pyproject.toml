[project]
name = "unsupervised-learning"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "einops",
    "torch",
    "torchvision",
    "torchaudio",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "tqdm",
    "jupyter",
    "ipykernel",
    "polars>=2.0.0",
    "huggingface-hub[hf-xet]>=2.2.0",
    "marimo[lsp]>=0.25.1",
    "hf-transfer>=0.1.9",
    "nvidia-dali-cuda120>=2.3.0",
    "pyarrow>=26.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
